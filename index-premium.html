<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5d91">
<title>IPO Tracker</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2b;--line:#20384d;--text:#edf6ff;--muted:#91a8bb;--teal:#36e0cf;--green:#7be0a4;--green-bg:#123b31;--red:#ff9292;--red-bg:#49282f;--shadow:0 12px 32px rgba(0,0,0,.20)}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:radial-gradient(ellipse at 50% -20%,#15354b 0,transparent 48%),var(--bg);color:var(--text);line-height:1.45}
header{background:rgba(8,20,34,.96);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);color:var(--text);padding:20px 16px 12px;position:sticky;top:0;z-index:5;box-shadow:0 8px 24px #0002}header:after{content:"";display:block;height:2px;margin:14px -16px 0;background:linear-gradient(90deg,transparent,var(--teal),#4888ff,transparent);opacity:.75}
h1{margin:0;font-size:clamp(23px,4vw,31px);font-weight:800;letter-spacing:-.8px}.sub{margin-top:5px;color:var(--muted);font-size:13px}.brand{margin:0 0 4px;font-size:11px;font-weight:800;letter-spacing:2.1px;text-transform:uppercase;color:var(--teal)}
nav{display:flex;gap:8px;margin-top:15px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}nav button,.btn{border:1px solid var(--line);border-radius:12px;padding:11px 15px;background:#102338;color:#c3d8e8;font-weight:750;font-size:13px;white-space:nowrap;transition:transform .18s ease,border-color .18s ease,background .18s ease;cursor:pointer}nav button:hover,.btn:hover{transform:translateY(-1px);border-color:#3a7e8b}nav button.active,.btn.primary{background:var(--teal);border-color:var(--teal);color:#05202a;box-shadow:0 5px 18px #36e0cf20}
main{padding:18px 14px 40px;max-width:1400px;margin:auto}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}.card{min-width:0;background:linear-gradient(145deg,#102338,#0b1928);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.label{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.35px}.value{font-size:clamp(22px,3vw,30px);font-weight:850;letter-spacing:-.7px;margin-top:8px;color:var(--text);overflow-wrap:anywhere}
.table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:13px}.ipo-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;background:linear-gradient(100deg,#10283b,#0d1b2b);font-weight:800;color:var(--text);border-bottom:1px solid var(--line);flex-wrap:wrap;cursor:pointer;user-select:none}.ipo-head.collapsed{border-bottom:0}.ipo-title{display:flex;align-items:center;gap:9px;min-width:0;flex:1 1 auto}.ipo-title .chev{display:inline-block;font-size:12px;color:var(--teal);width:12px;text-align:center;flex-shrink:0}.ipo-title .ipo-name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ipo-stats{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;font-weight:750}.ipo-stats .stat{background:#183047;color:#a9c6db;padding:5px 9px;border-radius:999px;white-space:nowrap;border:1px solid #29445b}.ipo-stats .stat.green,.green{background:var(--green-bg);color:var(--green)}.ipo-stats .stat.red,.red{background:var(--red-bg);color:var(--red)}.ipo-stats .stat.gray,.gray{background:#1a2b3c;color:#b2c1ce}
select,input{padding:10px;border:1px solid #29445b;border-radius:10px;background:#0b1a29;color:var(--text);font:inherit;font-size:13px;outline:none;max-width:100%}select:focus,input:focus{border-color:var(--teal);box-shadow:0 0 0 3px #36e0cf18}select{min-width:120px}input[type=number]{width:110px;text-align:right}.acc-list{display:block}.acc-row{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"name pl" "applied allot";gap:7px 9px;padding:11px 12px;border-bottom:1px solid #1a2d3f;align-items:center}.acc-row:last-child{border-bottom:0}.acc-name{grid-area:name;font-weight:750;color:#d8f9f4;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.acc-applied{grid-area:applied}.acc-allot{grid-area:allot}.acc-pl{grid-area:pl;justify-self:end;text-align:right}.acc-row select,.acc-row input{width:100%;padding:8px;font-size:12px;border-radius:9px}.acc-row input[type=number]{text-align:right}.pl-badge{display:inline-block;padding:6px 10px;border-radius:9px;font-size:12px;font-weight:800}.muted{color:#70879b;font-size:12px}
@media(min-width:641px){.acc-row{grid-template-columns:1.3fr 1fr 1fr 1fr;grid-template-areas:"name applied allot pl";padding:10px 16px}}
.modal{position:fixed;inset:0;background:#020811c9;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.box{background:#0d1b2b;border:1px solid #29445b;border-radius:20px;padding:22px;width:min(520px,100%);box-shadow:0 24px 70px #0008}.box h2{margin-top:0;letter-spacing:-.4px}.field{margin:14px 0}.field label{display:block;margin-bottom:7px;font-weight:750;color:#d9eaf5}.field input{width:100%}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.notice{background:#352e19;border:1px solid #6b5827;color:#ffe5a0;padding:13px;border-radius:12px;margin-bottom:14px;font-size:14px}.empty{text-align:center;padding:38px 18px;color:var(--muted);background:var(--panel);border:1px dashed #29445b;border-radius:16px}
@media(max-width:700px){.cards{grid-template-columns:1fr 1fr;gap:9px}.card{padding:14px;border-radius:15px}.card:last-child{grid-column:1/-1}h1{font-size:23px}.value{font-size:24px}header{padding:17px 13px 10px}main{padding:14px 10px 30px}.ipo-head{align-items:flex-start;padding:12px}.ipo-stats{width:100%}.toolbar .btn{flex:1 1 auto}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <p class="brand">Vikash Kumar</p>
  <h1>📈 IPO Tracker</h1><div class="sub">16 Accounts • Allotment & Profit/Loss</div>
  <nav><button class="active" id="tabTracker">IPO Tracker</button><button id="tabAccounts">Accounts</button><button id="tabSummary">Summary</button></nav>
</header>
<main>
  <div id="setupNotice" class="notice" style="display:none">⚙️ Supabase connection is not configured yet. Open <b>Setup</b> and enter your Project URL and anon key.</div>
  <section id="tracker">
    <div class="toolbar">
      <button class="btn primary" id="addIpoBtn">＋ Add IPO</button>
      <button class="btn" id="setupBtn">⚙ Setup</button>
      <button class="btn" id="refreshBtn">↻ Refresh</button>
    </div>
    <div class="cards">
      <div class="card"><div class="label">Total IPOs</div><div class="value" id="totalIpos">0</div></div>
      <div class="card"><div class="label">Allotted</div><div class="value" id="totalAllotted">0</div></div>
      <div class="card"><div class="label">Total Profit / Loss</div><div class="value" id="totalPL">₹0</div></div>
    </div>
    <div id="ipoList"></div>
  </section>
  <section id="accounts" style="display:none">
    <div class="toolbar"><button class="btn primary" id="addAccountBtn">＋ Add Account</button></div>
    <div class="card"><div id="accountList"></div></div>
  </section>
  <section id="summary" style="display:none">
    <div class="cards">
      <div class="card"><div class="label">Accounts</div><div class="value" id="sumAccounts">0</div></div>
      <div class="card"><div class="label">Applications</div><div class="value" id="sumApps">0</div></div>
      <div class="card"><div class="label">Total P/L</div><div class="value" id="sumPL">₹0</div></div>
    </div>
  </section>
</main>

<div class="modal" id="modal"><div class="box"><h2 id="modalTitle">Add IPO</h2><div id="modalBody"></div><div class="actions"><button class="btn" id="cancelBtn">Cancel</button><button class="btn primary" id="saveBtn">Save</button></div></div></div>

<script>
const DEFAULT_ACCOUNTS=['VIKASH','MAA','PAPA','DII','RAHUL','ACCOUNT 6','ACCOUNT 7','ACCOUNT 8','ACCOUNT 9','ACCOUNT 10','ACCOUNT 11','ACCOUNT 12','ACCOUNT 13','ACCOUNT 14','ACCOUNT 15','ACCOUNT 16'];
let cfg={url:localStorage.getItem('ipo_sb_url')||'',key:localStorage.getItem('ipo_sb_key')||''};
let accounts=[], ipos=[], apps=[];
let expanded=new Set();

const $=id=>document.getElementById(id);
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
function configured(){return cfg.url&&cfg.key}
async function api(path, options={}){
  if(!configured()) throw new Error('Supabase is not configured');
  const res=await fetch(cfg.url.replace(/\/$/,'')+'/rest/v1/'+path,{
    ...options,headers:{'apikey':cfg.key,'Authorization':'Bearer '+cfg.key,'Content-Type':'application/json','Prefer':options.method==='POST'?'return=representation':'return=minimal',...(options.headers||{})}
  });
  if(!res.ok) throw new Error(await res.text());
  const t=await res.text(); return t?JSON.parse(t):null;
}
async function load(){
  if(!configured()){ $('setupNotice').style.display='block'; render(); return }
  $('setupNotice').style.display='none';
  try{
    accounts=await api('accounts?select=*&order=sort_order,id');
    ipos=await api('ipos?select=*&order=created_at,id');
    apps=await api('applications?select=*&order=id');
    render();
  }catch(e){alert('Load error: '+e.message)}
}
function render(){
  const cols=accounts.length?accounts:DEFAULT_ACCOUNTS.map((name,i)=>({id:'d'+i,name,sort_order:i+1}));
  const totalPL=apps.reduce((s,a)=>s+Number(a.profit_loss||0),0);
  $('totalIpos').textContent=ipos.length;
  $('totalAllotted').textContent=apps.filter(a=>a.status==='Allotted').length;
  $('totalPL').textContent=money(totalPL);
  $('ipoList').innerHTML=ipos.length?ipos.map(ipo=>ipoBlock(ipo,cols)).join(''):'<div class="empty">No IPO added yet. Tap “Add IPO”.</div>';
  $('accountList').innerHTML=cols.map((a,i)=>`<div style="padding:12px;border-bottom:1px solid #eee"><b>${i+1}. ${esc(a.name)}</b></div>`).join('');
  $('sumAccounts').textContent=cols.length;$('sumApps').textContent=apps.length;$('sumPL').textContent=money(totalPL);
}
function ipoBlock(ipo,cols){
  const ipoApps=apps.filter(a=>Number(a.ipo_id)===Number(ipo.id));
  const appliedCount=ipoApps.length;
  const allottedCount=ipoApps.filter(a=>a.status==='Allotted').length;
  const ipoPL=ipoApps.reduce((s,a)=>s+Number(a.profit_loss||0),0);
  const plCls=ipoPL>0?'green':ipoPL<0?'red':'gray';
  const isOpen=expanded.has(Number(ipo.id));
  const rows=cols.map(a=>accountRow(ipo,a)).join('');
  return `<div class="table-wrap">
    <div class="ipo-head${isOpen?'':' collapsed'}" tabindex="0" role="button" aria-expanded="${isOpen}" onclick="toggleIpo(${ipo.id})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleIpo(${ipo.id})}">
      <div class="ipo-title"><span class="chev">${isOpen?'▾':'▸'}</span><span class="ipo-name">${esc(ipo.name)}</span></div>
      <div class="ipo-stats">
        <span class="stat">Applied ${appliedCount}/${cols.length}</span>
        <span class="stat">Allotted ${allottedCount}</span>
        <span class="stat ${plCls}">P/L ${money(ipoPL)}</span>
      </div>
    </div>
    ${isOpen?`<div class="acc-list">${rows}</div>`:''}
  </div>`;
}
function accountRow(ipo,a){
  const app=apps.find(x=>Number(x.ipo_id)===Number(ipo.id)&&Number(x.account_id)===Number(a.id));
  const applied=!!app;
  const allotment=app?.status||'Not Allotted';
  const pl=Number(app?.profit_loss||0);
  const plCls=pl>0?'green':pl<0?'red':'gray';
  const allotmentCell=applied?`<select class="${allotment==='Allotted'?'green':'red'}" onchange="changeAllotment(${ipo.id},${a.id},this.value,${app.id})"><option value="Not Allotted" ${allotment==='Not Allotted'?'selected':''}>Not Allotted</option><option value="Allotted" ${allotment==='Allotted'?'selected':''}>Allotted</option></select>`:'<span class="muted">—</span>';
  const plCell=applied&&allotment==='Allotted'?`<input type="number" step="any" value="${pl}" class="${plCls}" onchange="changePL(${ipo.id},${a.id},${app.id},this.value)">`:`<span class="pl-badge ${plCls}">${money(pl)}</span>`;
  return `<div class="acc-row">
    <div class="acc-name">${esc(a.name)}</div>
    <div class="acc-applied"><select class="${applied?'green':'gray'}" onchange="changeApplication(${ipo.id},${a.id},this.value,${app?.id||0})"><option value="Not Applied" ${!applied?'selected':''}>Not Applied</option><option value="Applied" ${applied?'selected':''}>Applied</option></select></div>
    <div class="acc-allot">${allotmentCell}</div>
    <div class="acc-pl">${plCell}</div>
  </div>`;
}
function toggleIpo(id){
  id=Number(id);
  if(expanded.has(id)) expanded.delete(id); else expanded.add(id);
  render();
}
async function changeApplication(ipoId,accountId,value,appId){
  try{
    if(value==='Applied'){
      if(!appId) await api('applications',{method:'POST',body:JSON.stringify({ipo_id:ipoId,account_id:accountId,status:'Not Allotted',profit_loss:0})});
    }else if(appId){
      await api('applications?id=eq.'+appId,{method:'DELETE'});
    }
    await load();
  }catch(e){alert('Save error: '+e.message);await load()}
}
async function changeAllotment(ipoId,accountId,value,appId){
  try{
    const body=value==='Allotted'?{status:'Allotted'}:{status:'Not Allotted',profit_loss:0};
    await api('applications?id=eq.'+appId,{method:'PATCH',body:JSON.stringify(body)});
    await load();
  }catch(e){alert('Save error: '+e.message);await load()}
}
async function changePL(ipoId,accountId,appId,value){
  try{
    const n=Number(value);
    if(Number.isNaN(n)) throw new Error('Enter a valid profit/loss amount');
    await api('applications?id=eq.'+appId,{method:'PATCH',body:JSON.stringify({profit_loss:n})});
    await load();
  }catch(e){alert('Save error: '+e.message);await load()}
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openModal(title,body,save){
  $('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.add('open');$('saveBtn').onclick=async()=>{try{await save()}catch(e){alert(e.message)}};
}
$('cancelBtn').onclick=()=>$('modal').classList.remove('open');
$('addIpoBtn').onclick=()=>{
  if(!configured()) return openSetup();
  openModal('Add IPO',`<div class="field"><label>IPO Name</label><input id="ipoName" placeholder="e.g. ABC Ltd."></div><div class="field"><label>Issue Price</label><input id="issuePrice" type="number" value="0"></div><div class="field"><label>Lot Size</label><input id="lotSize" type="number" value="0"></div>`,async()=>{
    const name=$('ipoName').value.trim();if(!name)throw Error('IPO name is required');
    await api('ipos',{method:'POST',body:JSON.stringify({name,issue_price:Number($('issuePrice').value||0),lot_size:Number($('lotSize').value||0)})});
    $('modal').classList.remove('open');await load();
  });
};
function openSetup(){
  openModal('Supabase Setup',`<div class="field"><label>Project URL</label><input id="sbUrl" value="${esc(cfg.url)}" placeholder="https://xxxxx.supabase.co"></div><div class="field"><label>Anon / Publishable Key</label><input id="sbKey" value="${esc(cfg.key)}" placeholder="eyJ..."></div><p style="font-size:13px;color:#687784">These are the browser-side Supabase connection details. Do not enter your database password or service-role key here.</p>`,async()=>{
    const u=$('sbUrl').value.trim().replace(/\/$/,'');const k=$('sbKey').value.trim();
    if(!u||!k)throw Error('Both fields are required');
    cfg={url:u,key:k};localStorage.setItem('ipo_sb_url',u);localStorage.setItem('ipo_sb_key',k);$('modal').classList.remove('open');await load();
  });
}
$('setupBtn').onclick=openSetup;$('refreshBtn').onclick=load;
$('addAccountBtn').onclick=()=>{
  if(!configured())return openSetup();
  openModal('Add Account',`<div class="field"><label>Account name</label><input id="accountName" placeholder="e.g. SISTER"></div>`,async()=>{
    const name=$('accountName').value.trim();if(!name)throw Error('Account name is required');
    await api('accounts',{method:'POST',body:JSON.stringify({name,sort_order:accounts.length+1})});$('modal').classList.remove('open');await load();
  });
};
function show(tab){
  $('tracker').style.display=tab==='tracker'?'block':'none';$('accounts').style.display=tab==='accounts'?'block':'none';$('summary').style.display=tab==='summary'?'block':'none';
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));$('tab'+tab[0].toUpperCase()+tab.slice(1)).classList.add('active');
}
$('tabTracker').onclick=()=>show('tracker');$('tabAccounts').onclick=()=>show('accounts');$('tabSummary').onclick=()=>show('summary');
load();
</script>
</body>
</html>
